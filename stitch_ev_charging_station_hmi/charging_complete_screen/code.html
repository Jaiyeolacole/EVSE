<body class="bg-background text-on-surface">
<!-- Ambient Animation Layer -->
<div class="glow-overlay"></div>
<!-- Header (Shared Component: TopAppBar) -->
<header class="fixed top-0 w-full h-[30px] flex justify-between items-center px-margin_edge bg-surface border-b border-outline-variant z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="ev_station">ev_station</span>
<span class="text-label-caps font-label-caps text-primary tracking-wider">EVCS-NG-001</span>
</div>
<div class="flex items-center gap-3">
<span class="text-label-caps font-label-caps text-success-accent bg-success-accent/20 px-1.5 py-0.5 rounded-sm">DONE</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant" data-icon="wifi">wifi</span>
</div>
</header>
<!-- Main Content Area (190px height reserved) -->
<main class="mt-[30px] h-[190px] px-margin_edge flex flex-col justify-center items-center z-20 relative">
<!-- Success State Indicator -->
<div class="flex flex-col items-center mb-3">
<div class="w-12 h-12 rounded-full border-2 border-success-accent flex items-center justify-center mb-1 scale-95 transition-transform active:scale-90">
<span class="material-symbols-outlined text-[32px] text-success-accent" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h1 class="text-headline-md font-headline-md text-on-surface tracking-tight">SESSION COMPLETE</h1>
</div>
<!-- Receipt Area / Transaction Summary (Bento-style Cards) -->
<div class="grid grid-cols-2 gap-2 w-full max-w-[280px]">
<!-- Energy Card -->
<div class="bg-[#161B22] border border-[#1E2630] rounded-lg p-2 flex flex-col items-start">
<span class="text-label-caps font-label-caps text-outline uppercase">Delivered</span>
<div class="flex items-baseline gap-1 mt-0.5">
<span class="text-body-lg font-body-lg text-on-surface">18.42</span>
<span class="text-label-caps font-label-caps text-primary">kWh</span>
</div>
</div>
<!-- Cost Card -->
<div class="bg-[#161B22] border border-[#1E2630] rounded-lg p-2 flex flex-col items-start">
<span class="text-label-caps font-label-caps text-outline uppercase">Cost</span>
<div class="flex items-baseline gap-1 mt-0.5">
<span class="text-label-caps font-label-caps text-primary">$</span>
<span class="text-body-lg font-body-lg text-on-surface">2.95</span>
</div>
</div>
</div>
</main>
<!-- Footer (Shared Component: Footer) -->
<footer class="fixed bottom-0 w-full h-[20px] bg-surface-container-lowest flex flex-col justify-between z-10">
<!-- Progress Bar for "Returning to Idle" -->
<div class="w-full h-[2px] bg-[#1E2630]">
<div class="progress-fill h-full bg-primary" id="idle-timer" style="width: 0%"></div>
</div>
<div class="flex justify-between items-center px-margin_edge h-[18px]">
<span class="text-label-caps font-label-caps text-outline">Returning to idle...</span>
<span class="text-label-caps font-label-caps text-outline">FW v2.4.1 | SYSTEM READY</span>
</div>
</footer>
<script>
        // Simple micro-interaction for the "Returning to idle" progress bar
        let progress = 0;
        const progressBar = document.getElementById('idle-timer');
        const duration = 10000; // 10 seconds to return to idle
        const intervalTime = 100;
        const increment = (intervalTime / duration) * 100;

        const timer = setInterval(() => {
            progress += increment;
            if (progress >= 100) {
                progress = 100;
                clearInterval(timer);
                // In a real app, this would trigger the screen transition
            }
            progressBar.style.width = progress + '%';
        }, intervalTime);

        // Map material icons from span content to specific properties if needed
        document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
            const iconName = icon.getAttribute('data-icon');
            if (iconName) {
                icon.innerText = iconName;
            }
        });
    </script>
