<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SCR_EMERGENCY_STOP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes pulse-red {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(226, 75, 74, 0.4); }
            70% { transform: scale(1.05); opacity: 0.8; box-shadow: 0 0 0 20px rgba(226, 75, 74, 0); }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(226, 75, 74, 0); }
        }
        .animate-pulse-red {
            animation: pulse-red 2s infinite ease-in-out;
        }
        .bg-emergency { background-color: #E24B4A; }
        .text-emergency { color: #E24B4A; }
        .border-emergency { border-color: rgba(226, 75, 74, 0.3); }
        
        body {
            width: 320px;
            height: 240px;
            margin: 0;
            overflow: hidden;
            background-color: #0D1117;
            font-family: 'Montserrat', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error-container": "#ffdad6",
                      "inverse-on-surface": "#2d3037",
                      "outline-variant": "#414753",
                      "primary": "#abc7ff",
                      "secondary-container": "#18a659",
                      "secondary": "#61de8a",
                      "error-container": "#93000a",
                      "on-tertiary": "#512400",
                      "surface-dim": "#10131a",
                      "tertiary-container": "#e07316",
                      "background": "#10131a",
                      "primary-fixed-dim": "#abc7ff",
                      "on-surface-variant": "#c1c6d5",
                      "surface-container-high": "#272a31",
                      "on-tertiary-fixed": "#311300",
                      "tertiary-fixed": "#ffdbc7",
                      "on-primary": "#002f65",
                      "tertiary-fixed-dim": "#ffb688",
                      "surface-variant": "#32353c",
                      "surface-container-lowest": "#0b0e15",
                      "on-background": "#e0e2eb",
                      "secondary-fixed": "#7efba4",
                      "inverse-primary": "#005cba",
                      "primary-container": "#448ffd",
                      "on-tertiary-container": "#471f00",
                      "surface-tint": "#abc7ff",
                      "on-primary-fixed-variant": "#00458e",
                      "tertiary": "#ffb688",
                      "secondary-fixed-dim": "#61de8a",
                      "on-secondary-container": "#003115",
                      "error": "#ffb4ab",
                      "on-secondary": "#00391a",
                      "inverse-surface": "#e0e2eb",
                      "surface-container-low": "#191c22",
                      "surface": "#10131a",
                      "surface-container-highest": "#32353c",
                      "outline": "#8b919f",
                      "surface-container": "#1d2026",
                      "on-surface": "#e0e2eb",
                      "primary-fixed": "#d7e3ff",
                      "on-primary-fixed": "#001b3f",
                      "on-error": "#690005",
                      "on-primary-container": "#002959",
                      "on-secondary-fixed": "#00210c",
                      "on-tertiary-fixed-variant": "#733600"
              },
              "spacing": {
                      "margin_edge": "12px",
                      "grid_unit": "8px",
                      "main_height": "190px",
                      "header_height": "30px",
                      "footer_height": "20px",
                      "gutter": "8px"
              },
              "fontFamily": {
                      "body-sm": ["Montserrat"],
                      "display-speed": ["Montserrat"],
                      "label-caps": ["Montserrat"],
                      "body-lg": ["Montserrat"],
                      "headline-md": ["Montserrat"]
              },
              "fontSize": {
                      "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                      "display-speed": ["48px", {"lineHeight": "48px", "letterSpacing": "-1px", "fontWeight": "700"}],
                      "label-caps": ["10px", {"lineHeight": "12px", "letterSpacing": "1px", "fontWeight": "700"}],
                      "body-lg": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                      "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
</head>
<body class="bg-background text-on-surface select-none">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-[30px] flex justify-between items-center px-margin_edge border-b border-emergency bg-surface">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-emergency text-[16px]" data-icon="ev_station">ev_station</span>
<span class="text-label-caps font-label-caps text-emergency">STATION-EV-042</span>
</div>
<div class="flex items-center gap-3">
<span class="text-label-caps font-label-caps text-on-surface-variant">04:21 PM</span>
<span class="material-symbols-outlined text-on-surface-variant text-[16px]" data-icon="wifi">wifi</span>
</div>
</header>
<!-- Main Content Area (190px) -->
<main class="mt-[30px] h-[190px] w-full flex flex-col items-center justify-center relative overflow-hidden px-margin_edge">
<!-- Animated Background Pulse Layer -->
<div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
<div class="w-48 h-48 rounded-full border-[8px] border-emergency animate-pulse-red"></div>
</div>
<!-- Emergency Icon -->
<div class="z-10 mb-2 flex items-center justify-center bg-[#161B22] border border-emergency w-14 h-14 rounded-xl animate-pulse-red">
<span class="material-symbols-outlined text-emergency text-[42px]" data-icon="front_hand" style="font-variation-settings: 'FILL' 1;">front_hand</span>
</div>
<!-- Status Messaging -->
<div class="z-10 text-center">
<h1 class="text-emergency font-headline-md text-headline-md tracking-tight mb-1">EMERGENCY STOP ACTIVE</h1>
<div class="flex flex-col gap-1 items-center">
<span class="text-on-surface font-body-lg text-body-lg">CHARGING TERMINATED</span>
<div class="flex gap-2 items-center mt-1">
<div class="px-2 py-0.5 rounded-full bg-emergency bg-opacity-10 border border-emergency">
<span class="text-emergency font-label-caps text-label-caps">SYSTEM LOCKED</span>
</div>
<span class="text-on-surface-variant font-body-sm text-body-sm">Remote reset required</span>
</div>
</div>
</div>
<!-- Decorative Tonal Layering Elements -->
<div class="absolute bottom-4 left-4 w-12 h-1 bg-emergency opacity-20 rounded-full"></div>
<div class="absolute bottom-4 right-4 w-12 h-1 bg-emergency opacity-20 rounded-full"></div>
</main>
<!-- Footer (20px) -->
<footer class="fixed bottom-0 w-full h-[20px] flex justify-between items-center px-margin_edge bg-surface-container-lowest">
<span class="text-label-caps font-label-caps text-outline">FW v2.4.1 | SYSTEM READY</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-outline text-[10px]" data-icon="lock">lock</span>
<span class="text-label-caps font-label-caps text-outline">HARDWARE DISCONNECT</span>
</div>
</footer>
<!-- Overlay Micro-interaction Script -->
<script>
        // Simple visual jitter on the emergency icon to emphasize severity
        const iconContainer = document.querySelector('.animate-pulse-red');
        setInterval(() => {
            if (Math.random() > 0.95) {
                iconContainer.style.transform = `translate(${Math.random() * 2 - 1}px, ${Math.random() * 2 - 1}px)`;
                setTimeout(() => {
                    iconContainer.style.transform = 'translate(0,0)';
                }, 50);
            }
        }, 100);

        // Map material icons from data attributes
        document.querySelectorAll('[data-icon]').forEach(el => {
            const iconName = el.getAttribute('data-icon');
            const span = document.createElement('span');
            span.className = 'material-symbols-outlined';
            span.textContent = iconName;
            
            // Apply size/color from parent if needed
            if (el.classList.contains('text-emergency')) span.classList.add('text-emergency');
            if (el.classList.contains('text-on-surface-variant')) span.classList.add('text-on-surface-variant');
            if (el.classList.contains('text-outline')) span.classList.add('text-outline');
            
            // Transfer font variations
            if (el.style.fontVariationSettings) span.style.fontVariationSettings = el.style.fontVariationSettings;
            
            // Replace the dummy element or append
            el.innerHTML = '';
            el.appendChild(span);
        });
    </script>
</body></html>
