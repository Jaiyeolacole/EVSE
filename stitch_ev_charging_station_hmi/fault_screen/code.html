<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>STATION-EV-042 - Fault Alert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes pulse-warning {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .animate-warning-pulse {
            animation: pulse-warning 1.5s ease-in-out infinite;
        }
        body {
            background-color: #0D1117;
            width: 320px;
            height: 240px;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error-container": "#ffdad6",
                      "inverse-on-surface": "#2d3037",
                      "outline-variant": "#414753",
                      "primary": "#abc7ff",
                      "secondary-container": "#18a659",
                      "secondary": "#61de8a",
                      "error-container": "#93000a",
                      "on-tertiary": "#512400",
                      "surface-dim": "#10131a",
                      "tertiary-container": "#e07316",
                      "background": "#10131a",
                      "primary-fixed-dim": "#abc7ff",
                      "on-surface-variant": "#c1c6d5",
                      "surface-container-high": "#272a31",
                      "on-tertiary-fixed": "#311300",
                      "tertiary-fixed": "#ffdbc7",
                      "on-primary": "#002f65",
                      "tertiary-fixed-dim": "#ffb688",
                      "surface-variant": "#32353c",
                      "surface-container-lowest": "#0b0e15",
                      "on-background": "#e0e2eb",
                      "secondary-fixed": "#7efba4",
                      "inverse-primary": "#005cba",
                      "primary-container": "#448ffd",
                      "on-tertiary-container": "#471f00",
                      "surface-tint": "#abc7ff",
                      "on-primary-fixed-variant": "#00458e",
                      "tertiary": "#ffb688",
                      "secondary-fixed-dim": "#61de8a",
                      "on-secondary-container": "#003115",
                      "error": "#F2994A", /* Overridden to Warning Orange per prompt */
                      "on-secondary": "#00391a",
                      "inverse-surface": "#e0e2eb",
                      "surface-container-low": "#191c22",
                      "surface": "#10131a",
                      "surface-container-highest": "#32353c",
                      "outline": "#8b919f",
                      "surface-container": "#1d2026",
                      "on-surface": "#e0e2eb",
                      "primary-fixed": "#d7e3ff",
                      "on-primary-fixed": "#001b3f",
                      "on-error": "#000000",
                      "on-primary-container": "#002959",
                      "on-secondary-fixed": "#00210c",
                      "on-tertiary-fixed-variant": "#733600"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin_edge": "12px",
                      "grid_unit": "8px",
                      "main_height": "190px",
                      "header_height": "30px",
                      "footer_height": "20px",
                      "gutter": "8px"
              },
              "fontFamily": {
                      "body-sm": ["Montserrat"],
                      "label-caps": ["Montserrat"],
                      "body-lg": ["Montserrat"],
                      "headline-md": ["Montserrat"]
              },
              "fontSize": {
                      "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                      "label-caps": ["10px", {"lineHeight": "12px", "letterSpacing": "1px", "fontWeight": "700"}],
                      "body-lg": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                      "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
</head>
<body class="flex flex-col text-on-surface select-none">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-[30px] flex justify-between items-center px-margin_edge w-full bg-surface border-b border-outline-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-[#F2994A]">warning</span>
<span class="text-label-caps font-label-caps text-[#F2994A]">FAULT</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">EVCS-NG-001</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">wifi</span>
</div>
</header>
<!-- Main Content (190px) -->
<main class="mt-[30px] h-[190px] w-full px-margin_edge flex flex-col items-center justify-between py-gutter bg-[#0D1117] relative">
<!-- Fault Indicator Section -->
<div class="flex flex-col items-center justify-center gap-1 mt-1">
<div class="animate-warning-pulse">
<span class="material-symbols-outlined text-[48px] text-[#F2994A]" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<div class="text-center">
<h1 class="text-headline-md font-headline-md text-[#F2994A] leading-tight">CHARGING FAULT</h1>
<p class="text-label-caps font-label-caps text-outline tracking-[2px]">E-104</p>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-1">Overtemperature detected</p>
</div>
</div>
<!-- Acknowledge Button -->
<button class="w-full h-[40px] bg-[#F2994A] text-[#0D1117] font-bold text-label-caps font-label-caps rounded-xl flex items-center justify-center transition-transform active:scale-95 border border-[#F2994A]/20">
            ACKNOWLEDGE
        </button>
<!-- Subtle Gradient Glow behind icon -->
<div class="absolute top-[20px] left-1/2 -translate-x-1/2 w-24 h-24 bg-[#F2994A]/10 blur-2xl rounded-full pointer-events-none"></div>
</main>
<!-- Footer (20px) -->
<footer class="fixed bottom-0 w-full h-[20px] flex justify-between items-center px-margin_edge w-full bg-surface-container-lowest text-outline text-label-caps font-label-caps">
<span>FW v2.4.1 | SYSTEM READY</span>
<div class="flex gap-2 items-center">
<span class="w-2 h-2 rounded-full bg-[#F2994A]"></span>
<span>CRITICAL</span>
</div>
</footer>
<!-- Interactive Script for micro-interactions -->
<script>
        document.querySelector('button').addEventListener('click', function() {
            // Visual feedback for interaction
            this.classList.add('bg-on-surface');
            this.innerText = 'PROCESSING...';
            
            setTimeout(() => {
                this.classList.remove('bg-on-surface');
                this.innerText = 'ACKNOWLEDGED';
                this.style.opacity = '0.7';
                this.disabled = true;
            }, 600);
        });
    </script>
</body></html>
