<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vehicle Connected - Station EV-042</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2d3037",
                        "outline-variant": "#414753",
                        "primary": "#abc7ff",
                        "secondary-container": "#18a659",
                        "secondary": "#61de8a",
                        "error-container": "#93000a",
                        "on-tertiary": "#512400",
                        "surface-dim": "#10131a",
                        "tertiary-container": "#e07316",
                        "background": "#10131a",
                        "primary-fixed-dim": "#abc7ff",
                        "on-surface-variant": "#c1c6d5",
                        "surface-container-high": "#272a31",
                        "on-tertiary-fixed": "#311300",
                        "tertiary-fixed": "#ffdbc7",
                        "on-primary": "#002f65",
                        "tertiary-fixed-dim": "#ffb688",
                        "surface-variant": "#32353c",
                        "surface-container-lowest": "#0b0e15",
                        "on-background": "#e0e2eb",
                        "secondary-fixed": "#7efba4",
                        "inverse-primary": "#005cba",
                        "primary-container": "#448ffd",
                        "on-tertiary-container": "#471f00",
                        "surface-tint": "#abc7ff",
                        "on-primary-fixed-variant": "#00458e",
                        "tertiary": "#ffb688",
                        "secondary-fixed-dim": "#61de8a",
                        "on-secondary-container": "#003115",
                        "error": "#ffb4ab",
                        "on-secondary": "#00391a",
                        "inverse-surface": "#e0e2eb",
                        "surface-container-low": "#191c22",
                        "surface": "#10131a",
                        "surface-container-highest": "#32353c",
                        "outline": "#8b919f",
                        "surface-container": "#1d2026",
                        "on-surface": "#e0e2eb",
                        "primary-fixed": "#d7e3ff",
                        "on-primary-fixed": "#001b3f",
                        "on-error": "#690005",
                        "on-primary-container": "#002959",
                        "on-secondary-fixed": "#00210c",
                        "on-tertiary-fixed-variant": "#733600",
                        "accent-cyan": "#56CCF2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin_edge": "12px",
                        "grid_unit": "8px",
                        "main_height": "190px",
                        "header_height": "30px",
                        "footer_height": "20px",
                        "gutter": "8px"
                    },
                    "fontFamily": {
                        "body-sm": ["Montserrat"],
                        "display-speed": ["Montserrat"],
                        "label-caps": ["Montserrat"],
                        "body-lg": ["Montserrat"],
                        "headline-md": ["Montserrat"]
                    },
                    "fontSize": {
                        "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "display-speed": ["48px", {"lineHeight": "48px", "letterSpacing": "-1px", "fontWeight": "700"}],
                        "label-caps": ["10px", {"lineHeight": "12px", "letterSpacing": "1px", "fontWeight": "700"}],
                        "body-lg": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            width: 320px;
            height: 240px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0D1117;
            color: #e0e2eb;
            user-select: none;
        }

        .pulse-line {
            stroke-dasharray: 10, 10;
            animation: dash 1s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }

        .cyan-glow {
            filter: drop-shadow(0 0 4px #56CCF2);
        }

        .status-dot {
            animation: blink 1.5s step-start infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-body-sm bg-surface-container-lowest">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-[30px] flex justify-between items-center px-margin_edge border-b border-outline-variant bg-surface">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-primary">ev_station</span>
<span class="text-label-caps font-label-caps text-primary">EVCS-NG-001</span>
</div>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1">
<div class="w-1.5 h-1.5 rounded-full bg-secondary-container status-dot"></div>
<span class="text-label-caps font-label-caps text-secondary">ONLINE</span>
</div>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">wifi</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="mt-[30px] h-[190px] px-margin_edge py-grid_unit flex flex-col items-center justify-between">
<!-- Animated Connection Diagram -->
<div class="w-full flex items-center justify-center h-[100px] relative">
<div class="flex items-center justify-between w-[240px] relative">
<!-- Vehicle Side -->
<div class="flex flex-col items-center gap-1">
<div class="w-14 h-14 rounded-lg bg-surface-container border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] text-on-surface">directions_car</span>
</div>
</div>
<!-- Animated Cable Line -->
<div class="absolute left-[56px] right-[56px] top-[28px] h-[2px]">
<svg class="cyan-glow" height="8" width="100%">
<line class="pulse-line" stroke="#56CCF2" stroke-linecap="round" stroke-width="2" x1="0" x2="100%" y1="4" y2="4"></line>
</svg>
</div>
<!-- Plug Side -->
<div class="flex flex-col items-center gap-1">
<div class="w-14 h-14 rounded-lg bg-surface-container border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] text-accent-cyan cyan-glow">ev_charger</span>
</div>
</div>
</div>
</div>
<!-- Connection Details Card -->
<div class="w-full bg-surface-container border border-outline-variant rounded-lg p-grid_unit flex flex-col items-center gap-0.5">
<h1 class="text-headline-md font-headline-md text-accent-cyan uppercase tracking-wider">Vehicle Connected</h1>
<p class="text-body-sm font-body-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] animate-spin">sync</span>
                Waiting for vehicle readiness
            </p>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full h-[20px] flex justify-between items-center px-margin_edge bg-surface-container-lowest">
<span class="text-label-caps font-label-caps text-outline">FW v2.4.1 | SYSTEM READY</span>
<div class="flex gap-4">
<span class="text-label-caps font-label-caps text-primary">CCS TYPE 2</span>
<span class="text-label-caps font-label-caps text-outline">400V DC</span>
</div>
</footer>
<!-- Overlay Interaction Script -->
<script>
        // Simple micro-interaction for the UI to feel "live"
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('main');
            container.addEventListener('touchstart', () => {
                container.style.transform = 'scale(0.99)';
                container.style.transition = 'transform 0.1s ease';
            });
            container.addEventListener('touchend', () => {
                container.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
