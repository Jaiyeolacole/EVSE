<style>
        body {

        .spinner-container {
            position: relative;
            width: 64px;

        .spinner {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(86, 204, 242, 0.1);
            border-top: 3px solid #56CCF2;
            border-radius: 50%;
            animation: spin 1s linear infinite;

            color: #56CCF2;
        }

            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-fill {
            width: 80%;
            animation: countdown 8s linear forwards;
        }

        @keyframes countdown {
            from { width: 100%; }
            to { width: 0%; }
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #56CCF2, transparent);
            top: 0;
            animation: scan 2s ease-in-out infinite;
        }

<script>
        // Simple countdown interaction
        let timeLeft = 8;
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                timerElement.innerText = `Timeout in 0${timeLeft}s`;
            } else {
                clearInterval(countdown);
                timerElement.innerText = "Reconnecting...";
            }
        }, 1000);

        // Micro-interaction for haptic feedback simulation
        document.body.addEventListener('touchstart', () => {
            document.body.style.transform = 'scale(0.99)';
            setTimeout(() => {
                document.body.style.transform = 'scale(1)';
            }, 50);
        });
    </script>
