<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>STATION-EV-042 - Charging Ready</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0D1117;
            width: 320px;
            height: 240px;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .pulse-glow {
            animation: pulse-cyan 2s ease-in-out infinite;
        }

        @keyframes pulse-cyan {
            0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 5px rgba(171, 199, 255, 0.4)); }
            50% { transform: scale(1.05); opacity: 0.8; filter: drop-shadow(0 0 15px rgba(171, 199, 255, 0.7)); }
        }

        .progress-fill {
            transition: width 1s linear;
        }

        .scanline {
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.03) 50%,
                rgba(255,255,255,0) 100%
            );
            background-size: 100% 4px;
            position: absolute;
            pointer-events: none;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#2d3037",
                        "outline-variant": "#414753",
                        "primary": "#abc7ff",
                        "secondary-container": "#18a659",
                        "secondary": "#61de8a",
                        "error-container": "#93000a",
                        "on-tertiary": "#512400",
                        "surface-dim": "#10131a",
                        "tertiary-container": "#e07316",
                        "background": "#10131a",
                        "primary-fixed-dim": "#abc7ff",
                        "on-surface-variant": "#c1c6d5",
                        "surface-container-high": "#272a31",
                        "on-tertiary-fixed": "#311300",
                        "tertiary-fixed": "#ffdbc7",
                        "on-primary": "#002f65",
                        "tertiary-fixed-dim": "#ffb688",
                        "surface-variant": "#32353c",
                        "surface-container-lowest": "#0b0e15",
                        "on-background": "#e0e2eb",
                        "secondary-fixed": "#7efba4",
                        "inverse-primary": "#005cba",
                        "primary-container": "#448ffd",
                        "on-tertiary-container": "#471f00",
                        "surface-tint": "#abc7ff",
                        "on-primary-fixed-variant": "#00458e",
                        "tertiary": "#ffb688",
                        "secondary-fixed-dim": "#61de8a",
                        "on-secondary-container": "#003115",
                        "error": "#ffb4ab",
                        "on-secondary": "#00391a",
                        "inverse-surface": "#e0e2eb",
                        "surface-container-low": "#191c22",
                        "surface": "#10131a",
                        "surface-container-highest": "#32353c",
                        "outline": "#8b919f",
                        "surface-container": "#1d2026",
                        "on-surface": "#e0e2eb",
                        "primary-fixed": "#d7e3ff",
                        "on-primary-fixed": "#001b3f",
                        "on-error": "#690005",
                        "on-primary-container": "#002959",
                        "on-secondary-fixed": "#00210c",
                        "on-tertiary-fixed-variant": "#733600",
                        "cyan-accent": "#56CCF2"
                    },
                    "spacing": {
                        "margin_edge": "12px",
                        "grid_unit": "8px",
                        "main_height": "190px",
                        "header_height": "30px",
                        "footer_height": "20px",
                        "gutter": "8px"
                    },
                    "fontFamily": {
                        "body-sm": ["Montserrat"],
                        "display-speed": ["Montserrat"],
                        "label-caps": ["Montserrat"],
                        "body-lg": ["Montserrat"],
                        "headline-md": ["Montserrat"]
                    },
                    "fontSize": {
                        "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "display-speed": ["48px", {"lineHeight": "48px", "letterSpacing": "-1px", "fontWeight": "700"}],
                        "label-caps": ["10px", {"lineHeight": "12px", "letterSpacing": "1px", "fontWeight": "700"}],
                        "body-lg": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface">
<!-- Screen Overlay effects -->
<div class="scanline"></div>
<!-- TopAppBar (Shared Component) -->
<header class="fixed top-0 w-full h-[30px] border-b border-outline-variant bg-surface flex justify-between items-center px-margin_edge z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="ev_station">ev_station</span>
<span class="text-label-caps font-label-caps text-primary">STATION-EV-042</span>
</div>
<div class="flex items-center gap-3">
<span class="text-label-caps font-label-caps text-on-surface-variant">READY</span>
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="wifi">wifi</span>
</div>
</header>
<!-- Main Content Area (190px) -->
<main class="mt-[30px] h-[190px] w-full flex flex-col items-center justify-center relative overflow-hidden px-margin_edge">
<!-- Background Atmospheric Element -->
<div class="absolute inset-0 opacity-10 pointer-events-none">

</div>
<!-- Central Status Card -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-grid_unit w-full max-w-[280px] flex flex-col items-center gap-2 z-10">
<div class="pulse-glow mb-1">
<span class="material-symbols-outlined text-[64px] text-cyan-accent" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div class="text-center">
<h1 class="text-headline-md font-headline-md text-on-surface leading-none mb-1">READY TO CHARGE</h1>
<p class="text-body-sm font-body-sm text-outline">Starting session...</p>
</div>
</div>
<!-- Connection Details (Subtle) -->
<div class="mt-2 flex gap-4 text-label-caps font-label-caps text-on-surface-variant opacity-60">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]" data-icon="cable">cable</span>
<span>CCS2</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]" data-icon="nest_eco_leaf">nest_eco_leaf</span>
<span>100% RENEWABLE</span>
</div>
</div>
</main>
<!-- Progress & Footer Zone (20px approx footer + bit of main) -->
<div class="px-margin_edge mb-1">
<div class="flex justify-between items-end mb-1">
<span class="text-label-caps font-label-caps text-outline">HANDSHAKE</span>
<span class="text-label-caps font-label-caps text-cyan-accent" id="countdown-text">12s</span>
</div>
<div class="h-[12px] bg-surface-variant rounded-full overflow-hidden w-full border border-outline-variant/30">
<div class="h-full bg-cyan-accent progress-fill" id="progress-bar" style="width: 100%;"></div>
</div>
</div>
<!-- Footer (Shared Component) -->
<footer class="fixed bottom-0 w-full h-[20px] bg-surface-container-lowest flex justify-between items-center px-margin_edge z-50">
<span class="text-label-caps font-label-caps text-outline">FW v2.4.1 | SYSTEM READY</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[12px] text-outline" data-icon="security">security</span>
<span class="text-label-caps font-label-caps text-outline">SECURE</span>
</div>
</footer>
<script>
        // Simple countdown simulation for the progress bar
        let seconds = 12;
        const total = 12;
        const progressFill = document.getElementById('progress-bar');
        const countdownText = document.getElementById('countdown-text');

        const interval = setInterval(() => {
            seconds--;
            if (seconds < 0) {
                // Keep at 0 or trigger next state
                clearInterval(interval);
                return;
            }
            
            const percentage = (seconds / total) * 100;
            progressFill.style.width = percentage + '%';
            countdownText.innerText = seconds + 's';

            // Visual feedback when getting close
            if (seconds <= 3) {
                countdownText.classList.remove('text-cyan-accent');
                countdownText.classList.add('text-secondary');
                progressFill.classList.remove('bg-cyan-accent');
                progressFill.classList.add('bg-secondary');
            }
        }, 1000);
    </script>
</body></html>
