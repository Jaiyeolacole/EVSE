            animation: pulse-green 2s infinite ease-in-out;
        }
        @keyframes flow-line {
            0% { stroke-dashoffset: 24; }
            100% { stroke-dashoffset: 0; }
        }
        .animate-flow {
            stroke-dasharray: 4, 2;
            animation: flow-line 1s linear infinite;
        }
        .circular-gauge {
            transform: rotate(-90deg);

</svg>

        // Simple micro-interaction for the "Tap card to stop" simulation
        document.querySelector('main > div:first-child').addEventListener('click', () => {
            const btn = document.querySelector('main > div:first-child');
            btn.classList.add('bg-error-container');
            setTimeout(() => {
                btn.classList.remove('bg-error-container');
            }, 500);
        });

        // Dynamic time update (optional, but adds to the "Dynamic feel")
        let startTime = Date.now();
        setInterval(() => {
            const now = Date.now();
            const diff = now - (now % 1000); // keep it synced

        }, 1000);
